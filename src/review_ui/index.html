<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マラソン投稿デスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500&family=Murecho:wght@700&family=Yuji+Syuku&display=swap">
<link rel="stylesheet" href="/desk.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <h1>マラソン投稿デスク<span class="mode-tag" data-demo hidden>デモ</span></h1>
      <p data-connection>読み込み中…</p>
    </div>
    <dl class="counts">
      <div class="count"><dt>承認待ち</dt><dd data-count="pending">0</dd></div>
      <div class="count is-block"><dt>要修正</dt><dd data-count="block">0</dd></div>
      <div class="count is-done"><dt>予約済み</dt><dd data-count="approved">0</dd></div>
      <div class="count"><dt>投稿済み</dt><dd data-count="posted">0</dd></div>
    </dl>
  </header>

  <section class="timeline" data-timeline aria-label="投稿予定" hidden>
    <div class="timeline-head">
      <span data-event-name>投稿予定</span>
      <span><kbd>J</kbd> <kbd>K</kbd> 移動　<kbd>A</kbd> 承認　<kbd>R</kbd> 却下</span>
    </div>
    <div class="timeline-scroll"><div class="track" data-track></div></div>
  </section>

  <div class="desk">
    <nav class="queue" aria-label="投稿キュー"><ul data-queue></ul></nav>
    <section class="preview" data-preview aria-label="投稿プレビュー"><p class="hint">読み込み中…</p></section>
    <aside class="checks" data-checks aria-label="公開前チェック"></aside>
  </div>
</div>
<div class="toast" role="status" data-toast hidden></div>
<script src="/app.js" defer></script>
</body>
</html>
